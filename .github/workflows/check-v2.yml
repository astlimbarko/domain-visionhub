name: Validar Front 2 (sin deploy)
on:
  push:
    branches: [codex/front-2]
    paths: ["frontend/**", ".github/workflows/check-v2.yml"]
concurrency:
  group: check-front-2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Compilar solamente Front 2
        working-directory: frontend
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:v2
      - name: Guardar artefacto compilado (sin deploy)
        uses: actions/upload-artifact@v4
        with:
          name: front-2
          path: frontend/dist-v2/
          include-hidden-files: true
